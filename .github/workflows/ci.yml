name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Matterbridge is provided by the host at runtime, so it is installed only for the build
      - run: npm install --no-save matterbridge
      - run: npm test

  # Matterbridge also runs under Bun, which lacks some Node crypto (RSA PKCS#1 decryption)
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm install --no-save matterbridge
      - run: npm run build
      - run: bun test ./test/
